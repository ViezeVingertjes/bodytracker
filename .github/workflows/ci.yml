name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # No pyrealsense2: it needs a source build on some platforms and the
        # tests deliberately require no camera and no hardware.
        run: |
          python -m pip install --upgrade pip
          pip install "mediapipe>=0.10.9,<2" "numpy>=1.24" "python-osc>=1.8" \
                      "opencv-contrib-python>=4.8" pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
